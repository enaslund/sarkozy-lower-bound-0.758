name: Palomar mechanical preflight
run-name: Palomar full mechanical preflight at ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palomar-preflight:
    # Keep this SHA and pipeline_commit identical. This is the official verifier,
    # including the protected Challenge audit, Lean kernel, and NanoDa replay.
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      # The verifier requires exactly twelve lowercase alphanumeric characters;
      # reusable-call concurrency and artifacts are additionally scoped by run.
      request_id: preflight002
      mode: full
      # Eric Naslund requested this preflight for his substantive development.
      # Omit project_path to select the repository root; a literal '.' is invalid.
      # existing_id marks this as a revision (version 2) of the registered entry.
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer","existing_id":"PALOMAR-2026-09-19-000006"}'
