name: Verify formalization

on:
  # Start the hosted verification explicitly during submission preparation.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - name: Build certificates sequentially and inspect foundational dependencies
        run: ./scripts/build-sequential.sh

  comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - name: Install bubblewrap for the comparator sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          # Ubuntu runners restrict unprivileged user namespaces through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the bundled comparator with Lean's kernel, NanoDa, and con-ron
        run: ./scripts/verify-comparator.sh
