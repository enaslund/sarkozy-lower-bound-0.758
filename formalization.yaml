status:
  scope: 'Proved: the general construction and all-large-N criterion; all six prime-chain certificates
    and moments; all odd free-digit/CRT lifts; the full 25-state/94-branch binary geometry, all numerical
    growth rows and fixed-depth inequality; the complete actual 4913-point 215 and 19683-point 437 witnesses,
    including every first-difference edge and all 1861 plus 18908 distinct-width power certificates. The
    exact exponent 37903373/50000000 has no remaining certificate assumptions. Comparator selects the
    criterion and the unconditional numerical result. Original-row moment interfaces were built and
    axiom-audited in the preserved version before cleanup. The cleaned endpoint-only source now
    passes the complete Lean build and all 76 axiom inspections; its complete independent NanoDa
    replay checked 32704 declarations with no errors and only the three standard axioms.
    Two deliberate Challenge placeholders are excluded from proof counts.'
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
