status:
  scope: >-
    Proved: the general construction and all-large-N criterion; all six prime-chain certificates
    and moments; all odd free-digit/CRT lifts, with a separate depth at each prime; the full
    25-state/94-branch binary geometry, all numerical growth rows and the fixed-depth inequality at
    depth 10^20; the complete actual 4913-point (5,43) witness with depths (3,3) and 3645-point
    (19,23) witness with depths (3,2), including every first-difference edge and all 1861 plus 3337
    distinct-width power certificates. The exact exponent 473797394875551/625000000000000 has no
    remaining certificate assumptions. Comparator selects the criterion and the unconditional
    numerical result. The sources use Lean v4.35.0-rc2 and the module system.
    Verification of this version: fresh Lean build, 76 axiom inspections, the bundled lake comparator with Lean, NanoDa and con-ron
    (both theorems accepted), and leanchecker replays of every module and of the fresh closure of
    Solution; see verification/README.md.
    Version 1 (exponent 0.75806746, Lean 4.32.0) was registered as PALOMAR-2026-09-19-000006 from commit
    e5d693729e23762b063a55015ad79ccaf28a3217; its records remain in verification/. Only the three
    standard axioms are allowed; two deliberate Challenge placeholders are excluded from proof counts.
