version: v0.4
project:
  name: An interval-moment criterion for square-difference-free integer sets
  description: >-
    We prove a general interval-moment criterion for square-difference-free integer sets and apply it
    to obtain an improved unconditional lower bound in Sarkozy's theorem, with exponent 0.75806746.
    If D(N) is the largest size of a subset of {1, ..., N} containing no two distinct elements whose
    difference is a square, then for every epsilon > 0 and all sufficiently large N we prove
    D(N) >= N^(0.75806746 - epsilon). The exact exponent is 37903373/50000000.
    The reusable criterion starts from finite digit sets in pairwise coprime square bases, with
    ordered intervals and width-moment inequalities. A strict surplus in the component exponents
    yields the asymptotic bound through finite stopping words, rank rounding, the Chinese remainder
    theorem, and interpolation between geometric scales.
    Both the general criterion and its numerical application are formalized in Lean. All nine
    concrete components are proved: six prime chains, a 25-state binary recursion, and the two
    complete composite witnesses for 215 and 437. Every required ordering, numerical moment,
    lifting, and asymptotic argument is checked, with no remaining finite-certificate hypotheses.
    The repository includes self-contained PDF and LaTeX write-ups of the full result and a simpler
    companion construction attaining exponent 0.758001 that explains several core ideas, together
    with exact computational certificate programs. The simpler construction is not separately
    formalized or a selected submission statement.
