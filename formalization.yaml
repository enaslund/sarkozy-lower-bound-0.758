version: v0.4
project:
  name: An interval-moment criterion for square-difference-free integer sets
  description: 'We prove a general interval-moment criterion for square-difference-free integer sets using
    finite stopping words, rank rounding, CRT and geometric interpolation, and derive the unconditional
    exponent 0.75806746. All nine concrete components are formalized: six prime chains, the entire binary
    component, and both complete odd witnesses, including every ordering and numerical moment check. Two
    related Comparator statements select the general criterion and its unconditional numerical application.'
  authors:
  - Eric Naslund
  responsible_maintainers:
  - Eric Naslund
  license: Apache-2.0
classification:
  arxiv:
  - math.NT
  - math.CO
  msc2020:
  - 11B75
  - 03B35
sources:
- title: 'Square-difference-free sets of exponent 0.75806746: Ordered intervals, composite digit codes, and a binary recursion'
  authors:
  - Eric Naslund
  type: paper
  location: papers/square-difference-free-sets-of-exponent-0.75806746.tex and papers/square-difference-free-sets-of-exponent-0.75806746.pdf at the submitted repository commit;
    Theorem 1.1 and the finite interval-moment criterion.
  relationship: other
  note: Accompanying self-contained exposition of this development, not an independent prior source or
    priority claim. The Lean proof uses the stopping-word argument described in the manuscript and PROOF.md.
    The manuscript was written by GPT-6-Astra, prompted and supervised by Eric Naslund; its opening
    author note was supplied verbatim by Eric Naslund. Contact naslund.math@gmail.com. Apache-2.0.
- title: A simpler construction of square-difference-free sets beyond exponent 0.758
  authors:
  - Eric Naslund
  type: paper
  location: papers/a-simpler-construction-of-square-difference-free-sets-beyond-exponent-0.758.tex and papers/a-simpler-construction-of-square-difference-free-sets-beyond-exponent-0.758.pdf at the submitted repository commit.
  relationship: other
  note: Accompanying exposition of a simpler construction with exponent 0.758001; this construction is
    not a separate Lean formalization or a selected Comparator result. Written by GPT-6-Astra under
    Eric Naslund's prompting and supervision, with his verbatim opening author note. Apache-2.0.
- title: Ranked residues, intervals, and the integer construction
  type: other
  location: Unpublished September 2026 research notes, synthesized as METHODS.md and CAPACITY-IMPROVEMENT.md
    in the working repository https://github.com/enaslund/sarkozy-lower-bound at commit
    fe0b29937c56b77ba5dd46328db340936e8473ac. These source files and the external computation bundles are not included
    in this standalone package. PROOF.md supplies a self-contained mathematical account of the formalized
    implication; README.md gives context and scope.
  relationship: adapts
  note: The general implication is formalized with finite stopping words. Original missing certificates
    were not retained; reconstructed data are encoded in Lean and checked by the kernel. All nine components,
    including the complete 215 and 437 witnesses, are proved without finite-check assumptions. No source-author
    endorsement or bibliographic priority is claimed.
- title: Square-Difference-Free Sets beyond the Three-Quarter Barrier
  authors:
  - Dmitry Krachun
  id: https://arxiv.org/abs/2608.01325v1
  type: paper
  location: arXiv:2608.01325v1 (2026), Section 2, especially Lemmas 4 and 5.
  relationship: adapts
  note: The ranked-block realization, square-base word lifting, and CRT combination follow this construction,
    using increasing ranks and reverse-rank representatives. The interval-moment criterion and stopping-word
    proof go beyond the cited lemmas. The paper's full numerical theorem is not formalized, and source-author
    endorsement is not asserted.
