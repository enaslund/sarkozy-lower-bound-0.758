fidelity:
  divergences: The interval-moment proof uses stopping words instead of entropy/Stirling estimates, as in the
    manuscript. Chain contributions are exact 25-decimal rationals with proved moments. Binary seed factor
    c=1/4 (below the manuscript's 0.3551) is absorbed by a proved depth margin of at least 45. The odd finite
    geometry uses conservative predecessor bit masks and endpoint cutoffs, with a separate depth at each
    prime; odd width-power and binary scale-power bounds use two direct 4096th-power endpoint comparisons and
    an eighth-order logarithm enclosure, cleared to integer polynomial comparisons. The endpoint checker has a
    general soundness proof for every positive integer degree. Scalar thresholds, chain logarithms and the
    binary depth use integer square-root ladders. Histogram permutations connect numerical and geometric row
    orders. The exponent, bases and component powers are those of the manuscript. Every certificate hypothesis
    is discharged. The simpler companion result is not formalized.
