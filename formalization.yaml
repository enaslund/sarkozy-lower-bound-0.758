fidelity:
  divergences: The interval-moment proof uses stopping words instead of entropy/Stirling estimates. Chain
    powers are rounded down to exact rationals with proved moments. Binary seed factor c=1/4 is absorbed
    by a proved depth margin of at least 27. The odd finite geometry uses conservative predecessor bit
    masks and endpoint cutoffs; odd width-power bounds use two direct 1024th-power endpoint comparisons
    and an eighth-order logarithm enclosure, cleared to integer polynomial comparisons. The endpoint
    checker has a general soundness proof for every positive integer degree. Scalar thresholds and
    binary estimates retain their integer square-root ladders. Histogram permutations
    connect numerical and geometric row orders. The full exponent, bases and component powers are preserved.
    Every certificate hypothesis is discharged. The smaller human-facing result is not formalized.
review:
  status: agent-reviewed
  reviewers:
  - Codex (GPT-6)
  notes: Agent review checked the construction, exact target parameters, compressed odd edge checker,
    polynomial log checker, histogram transport and unconditional submission statements. Reordered data
    retain the actual point/start/width tuples. Verification results and selected-statement coverage are
    recorded in verification/README.md. No human peer review or Palomar registration is claimed.
